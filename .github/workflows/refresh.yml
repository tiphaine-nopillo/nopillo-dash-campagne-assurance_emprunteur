name: refresh

on:
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Collecter les données HubSpot
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: python3 refresh.py
      - name: Publier si changement
        run: |
          git config user.name "signal-bot"
          git config user.email "bot@nopillo.com"
          git add data.json
          git diff --staged --quiet && echo "Aucun changement" && exit 0
          git commit -m "refresh $(date -u +%F)"
          git push
